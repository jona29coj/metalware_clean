services:
  backend:
    build:
      context: ./backend
    ports:
      - "3002:3002"
    env_file:
      - ./backend/.env
    environment:
      HOST: 0.0.0.0
    volumes:
      - ./backend/monthly_reports:/app/monthly_reports
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:3002
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
